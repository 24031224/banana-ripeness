[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-ripeness"
version = "0.1.0"
description = "Clasificador de madurez de plátanos con OpenCV clásico (HSV + reglas)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # orden de imports
    "UP",       # sintaxis moderna
    "B",        # bugbear
    "ANN",      # type hints obligatorios
    "D",        # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
